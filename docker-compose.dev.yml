# Local development services for gitbruv (Postgres + Redis + S3/MinIO).
# Start with:  docker compose -f docker-compose.dev.yml up -d
# Postgres is on host port 5434 to avoid clashing with other local pg instances.
services:
  postgres:
    image: postgres:17
    container_name: gitbruv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitbruv
      POSTGRES_PASSWORD: gitbruv
      POSTGRES_DB: gitbruv
    ports:
      - "5434:5432"
    volumes:
      - gitbruv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitbruv"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: gitbruv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gitbruv_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gitbruv-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gitbruv_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: waits for MinIO, then creates the repos bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/gitbruv-repos &&
      echo 'bucket gitbruv-repos ready'
      "

volumes:
  gitbruv_pgdata:
  gitbruv_redisdata:
  gitbruv_miniodata:
